# OpenOCD adapter config for the Iris Ti60F225 DemoBoard via the onboard
# FT4232H.  Adapted from the generated BSP ftdi_ti.cfg
# (iris_ws/embedded_sw/SapphireSoc/bsp/efinix/EfxSapphireSoc/openocd/ftdi_ti.cfg):
#   * device_desc dropped - this board's FTDI EEPROM keeps the factory string
#     "Quad RS232-HS"; the vendor cfg asks for "Titanium Ti60F225 Development
#     Kit" and openocd matches the description literally, so it never opens.
#     (Setting an empty device_desc is also wrong: it filters for "".)
#   * channel 1 = FT4232 interface B = /dev/ttyUSB1 (JTAG); UART is interface
#     C (/dev/ttyUSB2).
# Pair with the generated BSP debug_ti.cfg (irlen 5 Ti TAP, standard RISC-V
# debug via bscan tunnel).
set LEGACY_IDE 0
set STANDARD_DEBUG 1
set _CPUTAPID 0x10660A79

adapter driver ftdi
ftdi vid_pid 0x0403 0x6011
ftdi channel 1
ftdi layout_init 0x08 0x0b
